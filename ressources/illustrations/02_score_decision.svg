<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="333" viewBox="0 0 1000 333" role="img" aria-label="Un score sert à une règle de décision, pas à prouver une réponse">
<title>Un score sert à une règle de décision, pas à prouver une réponse</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#405879"/></marker></defs>
<style>text{font-family:Arial,DejaVu Sans,sans-serif;fill:#182d45}.title{font-size:25px;font-weight:700}.label{font-size:20px;font-weight:700}.small{font-size:18px}.tiny{font-size:16px}.arrow{stroke:#405879;stroke-width:3;fill:none;marker-end:url(#arrow)}.box{fill:#edf3fb;stroke:#9bb1ce;stroke-width:2}</style>
<rect width="1000" height="333" rx="18" fill="#fbfcff"/>
<text x="32" y="40" class="title">Un score sert à une règle de décision, pas à prouver une réponse</text>

<rect class="box" x="30" y="85" width="280" height="142" rx="12"/>
<text x="50" y="121" class="label">Meilleure proposition</text><text x="50" y="157" class="small">Une étiquette et son score</text><text x="50" y="193" class="small">Exemple fictif : 0,82</text>
<path class="arrow" d="M326 153 H365"/>
<path d="M491 74 L602 153 L491 232 L380 153 Z" fill="#fff0d8" stroke="#c99942" stroke-width="2"/>
<text x="491" y="145" class="small" text-anchor="middle">Score ≥ 0,80 ?</text><text x="491" y="174" class="tiny" text-anchor="middle">Seuil d'exemple</text>
<path class="arrow" d="M601 146 H642 V103 H686"/><text x="643" y="86" class="tiny">Oui</text>
<rect x="702" y="65" width="266" height="78" rx="10" fill="#e9f4ed" stroke="#8eb19a" stroke-width="2"/>
<text x="722" y="97" class="small">Étiquette proposée</text><text x="722" y="127" class="tiny">À valider sur de vrais exemples</text>
<path class="arrow" d="M601 160 H642 V222 H686"/><text x="647" y="202" class="tiny">Non</text>
<rect x="702" y="184" width="266" height="78" rx="10" fill="#fff0d8" stroke="#c99942" stroke-width="2"/>
<text x="722" y="216" class="small">À vérifier</text><text x="722" y="246" class="tiny">Pas forcément une erreur</text>
<text x="32" y="302" class="small">0,82 est ici un nombre inventé pour expliquer la règle ; les vrais scores arrivent dans le code.</text>

</svg>