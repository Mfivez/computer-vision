"#8b5cf6" stroke-width="8" fill="none"/><text x="538" y="109" font-size="23" fill="#17324d" font-weight="bold" text-anchor="start">Détection</text><text x="49" y="314" font-size="20" fill="#17324d" font-weight="normal" text-anchor="start">Une étiquette pour l’image entière</text><text x="49" y="347" font-size="19" fill="#17324d" font-weight="normal" text-anchor="start">Exemple illustratif : « bus »</text><rect x="559" y="131" width="244" height="109" rx="2" fill="none" stroke="#0f8a64" stroke-width="2"/><rect x="825" y="130" width="71" height="115" rx="2" fill="none" stroke="#0f8a64" stroke-width="2"/><text x="539" y="314" font-size="19" fill="#17324d" font-weight="normal" text-anchor="start">Une classe et une boîte par objet détecté</text><text x="539" y="347" font-size="18" fill="#17324d" font-weight="normal" text-anchor="start">Exemple illustratif : un bus + une personne</text><text x="35" y="401" font-size="17" fill="#17324d" font-weight="normal" text-anchor="start">Schéma explicatif : ces étiquettes ne sont pas des prédictions mesurées.</text></g></svg>
