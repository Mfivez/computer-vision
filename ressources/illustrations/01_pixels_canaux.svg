<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="390" viewBox="0 0 1000 390" role="img" aria-labelledby="title">
<title id="title">Un pixel : une position et trois valeurs de couleur</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#4578aa"/></marker></defs>
<rect width="1000" height="390" rx="18" fill="#f8fbff"/>
<g font-family="DejaVu Sans,Arial,sans-serif"><text x="28" y="40" font-size="24" fill="#17324d" font-weight="bold" text-anchor="start">Un pixel : une position et trois valeurs de couleur</text><text x="40" y="87" font-size="21" fill="#17324d" font-weight="normal" text-anchor="start">Une minuscule image RGB : 2 lignes × 3 colonnes</text><rect x="80" y="120" width="120" height="95" rx="0" fill="#ff0000" stroke="#4578aa" stroke-width="2"/><text x="140" y="175" font-size="16" fill="#ffffff" font-weight="normal" text-anchor="middle">y=0, x=0</text><rect x="210" y="120" width="120" height="95" rx="0" fill="#00ff00" stroke="#4578aa" stroke-width="2"/><text x="270" y="175" font-size="16" fill="#102a43" font-weight="normal" text-anchor="middle">y=0, x=1</text><rect x="340" y="120" width="120" height="95" rx="0" fill="#0000ff" stroke="#4578aa" stroke-width="2"/><text x="400" y="175" font-size="16" fill="#ffffff" font-weight="normal" text-anchor="middle">y=0, x=2</text><rect x="80" y="225" width="120" height="95" rx="0" fill="#ffff00" stroke="#4578aa" stroke-width="2"/><text x="140" y="280" font-size="16" fill="#102a43" font-weight="normal" text-anchor="middle">y=1, x=0</text><rect x="210" y="225" width="120" height="95" rx="0" fill="#000000" stroke="#4578aa" stroke-width="2"/><text x="270" y="280" font-size="16" fill="#ffffff" font-weight="normal" text-anchor="middle">y=1, x=1</text><rect x="340" y="225" width="120" height="95" rx="0" fill="#ffffff" stroke="#4578aa" stroke-width="2"/><text x="400" y="280" font-size="16" fill="#102a43" font-weight="normal" text-anchor="middle">y=1, x=2</text><path d="M460,160 L525,160" stroke="#4578aa" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="545" y="125" font-size="17" fill="#17324d" font-weight="normal" text-anchor="start">Le pixel bleu est à la ligne 0, colonne 2.</text><text x="545" y="163" font-size="20" fill="#17324d" font-weight="bold" text-anchor="start">image_rgb[0, 2] → [0, 0, 255]</text><text x="545" y="201" font-size="17" fill="#17324d" font-weight="normal" text-anchor="start">Ordre des valeurs : R, G, B</text><text x="545" y="239" font-size="17" fill="#17324d" font-weight="normal" text-anchor="start">Chaque canal est un nombre de 0 à 255.</text><text x="545" y="277" font-size="17" fill="#17324d" font-weight="bold" text-anchor="start">shape → (2, 3, 3)</text><text x="545" y="315" font-size="17" fill="#17324d" font-weight="normal" text-anchor="start">2 lignes, 3 colonnes, 3 canaux.</text></g></svg>
