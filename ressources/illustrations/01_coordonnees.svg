" height="56" rx="0" fill="#fee4ab" stroke="#4578aa" stroke-width="2"/><text x="304" y="248" font-size="18" fill="#17324d" font-weight="normal" text-anchor="middle">2,1</text><rect x="340" y="212" width="68" height="56" rx="0" fill="#e4effb" stroke="#4578aa" stroke-width="2"/><text x="374" y="248" font-size="18" fill="#17324d" font-weight="normal" text-anchor="middle">3,1</text><rect x="130" y="270" width="68" height="56" rx="0" fill="#e4effb" stroke="#4578aa" stroke-width="2"/><text x="164" y="306" font-size="18" fill="#17324d" font-weight="normal" text-anchor="middle">0,2</text><rect x="200" y="270" width="68" height="56" rx="0" fill="#e4effb" stroke="#4578aa" stroke-width="2"/><text x="234" y="306" font-size="18" fill="#17324d" font-weight="normal" text-anchor="middle">1,2</text><rect x="270" y="270" width="68" height="56" rx="0" fill="#e4effb" stroke="#4578aa" stroke-width="2"/><text x="304" y="306" font-size="18" fill="#17324d" font-weight="normal" text-anchor="middle">2,2</text><rect x="340" y="270" width="68" height="56" rx="0" fill="#e4effb" stroke="#4578aa" stroke-width="2"/><text x="374" y="306" font-size="18" fill="#17324d" font-weight="normal" text-anchor="middle">3,2</text><text x="550" y="160" font-size="22" fill="#17324d" font-weight="bold" text-anchor="start">Position dessinée : (x=2, y=1)</text><text x="550" y="211" font-size="20" fill="#17324d" font-weight="normal" text-anchor="start">Accès dans le tableau : image[1, 2]</text><text x="550" y="259" font-size="19" fill="#17324d" font-weight="normal" text-anchor="start">Un recadrage : image[y1:y2, x1:x2]</text><text x="550" y="304" font-size="17" fill="#17324d" font-weight="normal" text-anchor="start">La borne de fin du découpage est exclue.</text></g></svg>
