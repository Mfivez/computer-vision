<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400" role="img" aria-labelledby="title">
<title id="title">Ne pas confondre (x, y) et [ligne, colonne]</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#4578aa"/></marker></defs>
<rect width="1000" height="400" rx="18" fill="#f8fbff"/>
