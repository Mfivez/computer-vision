<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" role="img" aria-labelledby="title desc">
<title id="title">Comparer les propositions à une référence connue</title><desc id="desc">Scène pédagogique inventée. La référence contient trois personnes A B C. Le modèle propose des boîtes autour de A, de B et d’un panneau. La personne C est omise. Deux vrais positifs, un faux positif, un faux négatif.</desc>
