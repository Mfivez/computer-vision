<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360" role="img" aria-labelledby="title">
<title id="title">Une application rend aussi ses limites visibles</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#4578aa"/></marker></defs>
<rect width="1000" height="360" rx="18" fill="#f8fbff"/>
<g font-family="DejaVu Sans,Arial,sans-serif"><text x="28" y="40" font-size="24" fill="#17324d" font-weight="bold" text-anchor="start">Une application rend aussi ses limites visibles</text><rect x="30" y="90" width="290" height="185" rx="12" fill="#eaf3ff" stroke="#4578aa" stroke-width="2"/><text x="48" y="126" font-size="23" fill="#17324d" font-weight="bold" text-anchor="start">Lire</text><text x="48" y="168" font-size="16" fill="#17324d" font-weight="normal" text-anchor="start">Le fichier existe ?</text><text x="48" y="202" font-size="16" fill="#17324d" font-weight="normal" text-anchor="start">L’image est décodable ?</text><text x="48" y="236" font-size="16" fill="#17324d" font-weight="normal" text-anchor="start">Sinon : erreur lisible</text><rect x="355" y="90" width="290" height="185" rx="12" fill="#eaf3ff" stroke="#4578aa" stroke-width="2"/><text x="373" y="126" font-size="23" fill="#17324d" font-weight="bold" text-anchor="start">Détecter</text><text x="373" y="168" font-size="16" fill="#17324d" font-weight="normal" text-anchor="start">Pixels BGR → YOLO</text><text x="373" y="202" font-size="16" fill="#17324d" font-weight="normal" text-anchor="start">Boîtes + classes + scores</text><text x="373" y="236" font-size="16" fill="#17324d" font-weight="normal" text-anchor="start">Même réglage documenté</text><rect x="680" y="90" width="290" height="185" rx="12" fill="#eaf3ff" stroke="#4578aa" stroke-width="2"/><text x="698" y="126" font-size="23" fill="#17324d" font-weight="bold" text-anchor="start">Rendre compte</text><text x="698" y="168" font-size="16" fill="#17324d" font-weight="normal" text-anchor="start">Garder les boîtes bus</text><text x="698" y="202" font-size="16" fill="#17324d" font-weight="normal" text-anchor="start">Compter les boîtes retenues</text><text x="698" y="236" font-size="16" fill="#17324d" font-weight="normal" text-anchor="start">Pas de promesse de sécurité</text><path d="M323,185 L350,185" stroke="#4578aa" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M647,185 L675,185" stroke="#4578aa" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="36" y="325" font-size="23" fill="#17324d" font-weight="bold" text-anchor="start">Zéro boîte retenue ≠ preuve qu’aucun bus n’est présent.</text></g></svg>
