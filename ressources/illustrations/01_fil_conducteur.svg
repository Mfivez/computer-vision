<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-labelledby="title">
<title id="title">D’une photo à une information vérifiable</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#4578aa"/></marker></defs>
<rect width="1000" height="300" rx="18" fill="#f8fbff"/>
<g font-family="DejaVu Sans,Arial,sans-serif"><text x="28" y="40" font-size="24" fill="#17324d" font-weight="bold" text-anchor="start">D’une photo à une information vérifiable</text><rect x="25" y="82" width="215" height="135" rx="12" fill="#eaf3ff" stroke="#4578aa" stroke-width="2"/><text x="40" y="115" font-size="21" fill="#17324d" font-weight="bold" text-anchor="start">1 · Observer</text><text x="40" y="153" font-size="19" fill="#17324d" font-weight="normal" text-anchor="start">Photo de rue</text><text x="40" y="184" font-size="17" fill="#17324d" font-weight="normal" text-anchor="start">Lire les pixels</text><path d="M243,150 L268,150" stroke="#4578aa" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="270" y="82" width="215" height="135" rx="12" fill="#eaf3ff" stroke="#4578aa" stroke-width="2"/><text x="285" y="115" font-size="21" fill="#17324d" font-weight="bold" text-anchor="start">2 · Préparer</text><text x="285" y="153" font-size="19" fill="#17324d" font-weight="normal" text-anchor="start">OpenCV</text><text x="285" y="184" font-size="17" fill="#17324d" font-weight="normal" text-anchor="start">Afficher, recadrer</text><path d="M488,150 L513,150" stroke="#4578aa" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="515" y="82" width="215" height="135" rx="12" fill="#eaf3ff" stroke="#4578aa" stroke-width="2"/><text x="530" y="115" font-size="21" fill="#17324d" font-weight="bold" text-anchor="start">3 · Proposer</text><text x="530" y="153" font-size="19" fill="#17324d" font-weight="normal" text-anchor="start">Modèles appris</text><text x="530" y="184" font-size="17" fill="#17324d" font-weight="normal" text-anchor="start">Étiquettes / boîtes</text><path d="M733,150 L758,150" stroke="#4578aa" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="760" y="82" width="215" height="135" rx="12" fill="#eaf3ff" stroke="#4578aa" stroke-width="2"/><text x="775" y="115" font-size="21" fill="#17324d" font-weight="bold" text-anchor="start">4 · Interpréter</text><text x="775" y="153" font-size="19" fill="#17324d" font-weight="normal" text-anchor="start">Règle explicite</text><text x="775" y="184" font-size="17" fill="#17324d" font-weight="normal" text-anchor="start">Compter, vérifier</text><text x="32" y="267" font-size="21" fill="#17324d" font-weight="normal" text-anchor="start">La sortie du modèle est une proposition, pas une vérité garantie.</text></g></svg>
